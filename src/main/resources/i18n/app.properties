mcp.connect.desktop.fallbackRestart=Then quit Claude Desktop completely and open it again.
mcp.connect.code.token=Put the key into {{env}} without it reaching your shell history: run this, paste the key, and press Enter. Nothing is echoed.
mcp.connect.code.add=Add grieg to Claude Code in the same shell.
mcp.connect.code.mcpJson=Or share it with a project through .mcp.json; everyone sets {{env}} for themselves
mcp.connect.code.cards=Claude Code shows the results as text. Interactive cards need Claude Desktop.
mcp.connect.chatgpt.oauthOn=OAuth sign-in is on
mcp.connect.chatgpt.oauthOnDetail=ChatGPT connects by this server's URL and registers itself with grieg. You then sign in to Enonic and approve the connection, which takes the Grieg MCP role, as a personal key does. Each connection you approve is listed under Signed-in apps, where you can revoke it.
mcp.connect.chatgpt.oauthBlocked=OAuth sign-in is on, but not for ChatGPT
mcp.connect.chatgpt.oauthBlockedDetail=The oauth.redirectUris setting does not include ChatGPT's callback, https://chatgpt.com/connector_platform_oauth_redirect, so grieg refuses ChatGPT's sign-in. An administrator can add it in com.enonic.app.grieg.cfg. Until then, ChatGPT reaches grieg only through a tunnel that an administrator runs.
mcp.connect.chatgpt.redirectUris=Callbacks this server admits (oauth.redirectUris):
mcp.connect.chatgpt.oauthOff=OAuth sign-in is off on this server
mcp.connect.chatgpt.oauthOffDetail=ChatGPT has no field for a personal key, so it connects through OAuth sign-in or a tunnel. An administrator turns sign-in on with oauth.enabled = true in com.enonic.app.grieg.cfg and the vhost mappings described in the
mcp.connect.chatgpt.open=On chatgpt.com, open Plugins, select the plus button, and choose Add custom MCP server.
mcp.connect.chatgpt.connection=Enter a name such as grieg. Under Connection, enter this server URL.
mcp.connect.chatgpt.connectionTunnel=Enter a name such as grieg. Under Connection, select Tunnel, once an administrator runs one for grieg.
mcp.connect.chatgpt.auth=Under Authentication, choose OAuth. grieg needs no client ID or secret: ChatGPT registers itself.
mcp.connect.chatgpt.authTunnel=Under Authentication, choose No authentication.
mcp.connect.chatgpt.create=Review the risk warning, confirm it, and select Create as a plugin.
mcp.connect.chatgpt.signIn=ChatGPT opens a grieg page. Sign in to Enonic if asked, check that the page names ChatGPT and you, and select Approve.
mcp.connect.chatgpt.chat=In a chat, type @ and pick grieg.
mcp.connect.chatgpt.tunnel=A tunnel runs every request as the owner of the one key it holds, whoever is chatting, so it suits a demo rather than a team. How to run one is in the
mcp.connect.chatgpt.plans=Which ChatGPT plans can add a custom MCP server has not been verified, and workspace settings can prevent it.
