mcp.connect.desktop.install=Open the file, or drag it into Claude Desktop under Settings, Extensions, and choose Install.
mcp.connect.desktop.configure=When Desktop asks, paste these two values. Desktop keeps the key in its encrypted settings.
mcp.connect.desktop.chat=Make sure grieg is enabled, then start a new chat and ask about your content. The first request shows up in step 3.
mcp.connect.desktop.cards=Claude Desktop shows workflows, runs, schedules and nodes as interactive cards, and asks once before it shows the first one.
mcp.connect.desktop.fallback=Use a config file instead
mcp.connect.desktop.fallbackWhen=For Linux builds of Claude Desktop, or machines that block extensions. It runs the mcp-remote bridge through npx.
mcp.connect.desktop.fallbackWarning=This stores your key in plain text in the config file, and needs Node.js on this machine.
